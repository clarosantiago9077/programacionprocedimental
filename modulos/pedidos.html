<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Pedido</title>
  <link rel="stylesheet" href="../css/inventario.css">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>

<body>

<section class="section">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-half">

        <div class="box">
          <h2 class="title has-text-centered">Formulario de Pedido</h2>

          <form id="formPedido">


            <div class="field">
              <label class="label">Código Producto</label>
              <div class="control">
                <input id="codigoProducto" class="input" type="number" placeholder="Ingrese código del producto" required>
              </div>
            </div>


            <div class="field">
              <label class="label">Nombre del Usuario</label>
              <div class="control">
                <input id="nombreUsuario" class="input" type="text" placeholder="Ingrese su nombre" required>
              </div>
            </div>


            <div class="field">
              <label class="label">Producto</label>
              <div class="control">
                <input id="nombreProducto" class="input" type="text" placeholder="Ingrese el producto" required>
              </div>
            </div>


            <div class="field">
              <label class="label">Cantidad</label>
              <div class="control">
                <input id="cantidad" class="input" type="number" placeholder="Ingrese la cantidad" required>
              </div>
            </div>


            <div class="field">
              <label class="label">Dirección</label>
              <div class="control">
                <input id="direccion" class="input" type="text" placeholder="Ingrese la dirección" required>
              </div>
            </div>


            <div class="field">
              <label class="label">Teléfono</label>
              <div class="control">
                <input id="telefono" class="input" type="tel" placeholder="Ingrese su teléfono" required>
              </div>
            </div>


            <div class="field">
              <label class="label">Método de Pago</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select id="metodoPago" required>
                    <option value="">Seleccione</option>
                    <option>Efectivo</option>
                    <option>Tarjeta de Crédito</option>
                    <option>Tarjeta Débito</option>
                    <option>Transferencia</option>
                  </select>
                </div>
              </div>
            </div>


            <div class="field">
              <label class="label">Valor a Cancelar</label>
              <div class="control">
                <input id="valorCancelar" class="input" type="number" placeholder="Ingrese valor a cancelar" required>
              </div>
            </div>


            <div class="field">
              <div class="control">
                <button class="button is-primary is-fullwidth" type="submit">
                  Realizar Pedido
                </button>
              </div>
            </div>


            <div class="field">
              <div class="control">
                <a href="../index.html">
                  <button class="button is-light is-fullwidth" type="button">
                    Volver al inicio
                  </button>
                </a>
              </div>
            </div>


          </form>
        </div>

      </div>
    </div>
  </div>
</section>


<script src="../js/pedidos.js"></script>

</body>
</html>
